name: Java Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile Java Files
      run: |
        # هذا الأمر يبحث عن كل ملفات الجافا ويقوم بعمل Compile لها يدوياً
        javac src/student_grade/*.java -d .
